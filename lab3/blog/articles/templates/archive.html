<!DOCTYPE html>
<html>
<head>
    <title>Архив статей</title>
    {% load static %}
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #ddd;
        }
        .header img {
            max-height: 80px;
        }
        .archive {
            max-width: 800px;
            margin: 0 auto;
        }
        .one-post {
            background-color: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .post-title {
            color: #333;
            margin-top: 0;
        }
        .article-info {
            display: flex;
            justify-content: space-between;
            color: #666;
            font-size: 14px;
            margin-bottom: 15px;
        }
        .article-author {
            font-weight: bold;
        }
        .article-created-date {
            color: #888;
        }
        .article-text {
            line-height: 1.6;
            color: #444;
        }
        .no-articles {
            text-align: center;
            color: #666;
            font-style: italic;
            padding: 40px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Архив статей</h1>
        <!-- Для изображения можно использовать любую картинку -->
        <img src="{% static 'logo.png' %}" alt="Логотип блога" />
    </div>
    <div class="archive">
        {% if posts %}
            {% for post in posts %}
            <div class="one-post">
                <h2 class="post-title">{{ post.title }}</h2>
                <div class="article-info">
                    <div class="article-author">{{ post.author.username }}</div>
                    <div class="article-created-date">{{ post.created_date }}</div>
                </div>
                <p class="article-text">{{ post.get_excerpt }}</p>
            </div>
            {% endfor %}
        {% else %}
            <div class="no-articles">
                <p>Пока нет статей. Добавьте их через административную панель.</p>
            </div>
        {% endif %}
    </div>
</body>
</html>
